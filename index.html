<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Calisthenics — Phase 1</title>
  <meta name="theme-color" content="#0b1220" />
  <style>
    :root{
      --bg:#0b1220;
      --panel:#111a2b;
      --card:#0f172a;
      --card2:#0b1324;
      --text:#e6edf7;
      --muted:#a7b4cc;
      --line:rgba(255,255,255,.08);
      --brand:#5eead4;
      --brand2:#60a5fa;
      --warn:#fbbf24;
      --danger:#fb7185;
      --ok:#34d399;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --r:18px;
    }
    *{box-sizing:border-box}
    html{
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background: radial-gradient(1200px 800px at 30% -10%, rgba(96,165,250,.20), transparent 60%),
                  radial-gradient(900px 700px at 90% 0%, rgba(94,234,212,.18), transparent 60%),
                  var(--bg);
      color:var(--text);
    }
    .app{
      max-width: 560px;
      margin: 0 auto;
      padding: 18px 14px 28px;
      padding-bottom: calc(28px + env(safe-area-inset-bottom));
    }

    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 10px 4px 14px;
    }
    .title{display:flex; flex-direction:column; gap:6px;}
    .title h1{ margin:0; font-size:20px; letter-spacing:.2px; line-height:1.15; }
    .title p{ margin:0; color:var(--muted); font-size:14px; line-height:1.25; min-height: 1em; }
    .pill{
      padding: 8px 10px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.03);
      border-radius: 999px;
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
    }

    .grid{display:grid; gap:14px}
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
      border:1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .card .hd{
      padding: 14px 14px 12px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      border-bottom:1px solid var(--line);
      background: rgba(255,255,255,.02);
    }
    .card .hd .h{display:flex; flex-direction:column; gap:5px;}
    .card .hd .h .k{font-size:14px; color:var(--muted)}
    .card .hd .h .v{font-size:17px; font-weight:700; line-height:1.2;}
    .card .bd{ padding: 13px 14px 14px; }

    .row{display:flex; gap:10px; align-items:center; justify-content:space-between}
    .muted{color:var(--muted)}
    .tiny{font-size:14px}

    .btns{display:flex; flex-wrap:wrap; gap:10px}
    button{
      appearance:none;
      border:none;
      cursor:pointer;
      border-radius: 14px;
      padding: 12px 12px;
      min-height: 44px;
      font-weight:700;
      font-size: 15px;
      color: var(--text);
      background: rgba(255,255,255,.06);
      border:1px solid var(--line);
      transition: transform .08s ease, background .12s ease, border-color .12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    button:active{ transform: translateY(1px) }
    button.primary{
      background: linear-gradient(90deg, rgba(94,234,212,.20), rgba(96,165,250,.18));
      border-color: rgba(94,234,212,.35);
    }
    button.ghost{
      background: transparent;
      border-color: var(--line);
      color: var(--muted);
    }
    button.danger{
      background: rgba(251,113,133,.10);
      border-color: rgba(251,113,133,.35);
    }
    button:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .list{display:grid; gap:10px}
    .item{
      padding:12px 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.12);
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }
    .item .left{display:flex; flex-direction:column; gap:5px}
    .item .name{font-weight:700; font-size:15px;}
    .badge{
      font-size: 13px;
      padding: 7px 9px;
      border-radius: 999px;
      border:1px solid var(--line);
      color: var(--muted);
      white-space:nowrap;
      background: rgba(255,255,255,.03);
    }
    .badge.ok{ border-color: rgba(52,211,153,.35); color: rgba(52,211,153,.95); background: rgba(52,211,153,.08) }
    .badge.warn{ border-color: rgba(251,191,36,.35); color: rgba(251,191,36,.95); background: rgba(251,191,36,.08) }

    /* Workout UI */
    .workoutTop{display:flex; flex-direction:column; gap:12px;}
    .progress{
      height:10px;
      border-radius:999px;
      background: rgba(255,255,255,.06);
      overflow:hidden;
      border:1px solid var(--line);
    }
    .progress > div{
      height:100%;
      width:0%;
      background: linear-gradient(90deg, rgba(94,234,212,.85), rgba(96,165,250,.85));
      border-radius:999px;
      transition: width .15s ease;
    }

    .workoutCard{
      border-radius: var(--r);
      border:1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
      box-shadow: var(--shadow);
      padding: 14px;
      min-height: 330px;
      position: relative;
      overflow:hidden;
      transform: translateY(0);
      opacity: 1;

      /* IMPORTANT: laisse de la place pour la barre sticky */
      padding-bottom: calc(14px + 84px + env(safe-area-inset-bottom));
    }
    .workoutCard.enter{
      animation: cardEnter .18s ease-out;
    }
    @keyframes cardEnter{
      from{ opacity:.35; transform: translateY(6px); }
      to{ opacity:1; transform: translateY(0); }
    }

    .workoutCard .sub{ color: var(--muted); font-size: 15px; margin-top:4px; line-height:1.3;}
    .workoutCard h2{ margin:0; font-size: 22px; letter-spacing:.2px; line-height:1.15;}
    .workoutCard .meta{ margin-top:12px; display:flex; gap:8px; flex-wrap:wrap }
    .workoutCard .meta .chip{
      font-size:13px;
      padding:7px 9px;
      border-radius:999px;
      border:1px solid var(--line);
      color: var(--muted);
      background: rgba(255,255,255,.03);
    }

    .kpis{
      margin-top:12px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .kpi{
      padding:10px 12px;
      border-radius:14px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.03);
      display:flex;
      flex-direction:column;
      gap:3px;
      min-width: 130px;
    }
    .kpi .k{ font-size:13px; color: var(--muted); }
    .kpi .v{ font-size:15px; font-weight:800; }

    .entry{ margin-top: 14px; display:grid; gap:10px; }
    .field{ display:grid; gap:7px; }
    label{ font-size: 14px; color: var(--muted); }

    input, textarea, select{
      width:100%;
      background: rgba(0,0,0,.22);
      border:1px solid var(--line);
      color: var(--text);
      border-radius: 12px;
      padding: 12px 12px;
      font-size: 16px; /* iOS: évite le zoom */
      outline:none;
    }
    textarea{ min-height: 74px; resize: vertical; }
    .twocol{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }

    /* ====== STICKY FOOTER BAR ======
       Reste visible en bas de la carte sur iPhone (et desktop aussi).
    */
    .footerBar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;

      position: sticky;
      bottom: calc(10px + env(safe-area-inset-bottom));
      z-index: 10;

      margin-top: 14px;
      padding: 10px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(15,23,42,.88);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    .footerBar button{
      flex: 1 1 120px; /* gros boutons et équilibrés */
      min-height: 48px;
      font-size: 15px;
    }

    .hint{ margin-top: 10px; color: var(--muted); font-size: 14px; line-height: 1.4; }
    .center{ text-align:center; }

    /* Timer UI */
    .timerBox{
      border:1px solid var(--line);
      background: rgba(255,255,255,.03);
      border-radius: 14px;
      padding: 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .timerTime{
      font-size: 30px;
      font-weight: 900;
      letter-spacing:.5px;
    }
    .timerSub{
      font-size: 14px;
      color: var(--muted);
      margin-top:2px;
    }

    /* Toast */
    .toast{
      position: fixed;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      max-width: 560px;
      width: calc(100% - 24px);
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(15,23,42,.92);
      color: var(--text);
      box-shadow: var(--shadow);
      display:none;
      z-index: 50;
    }

    /* ===== REST OVERLAY ===== */
    #restOverlay{
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(2,6,23,.72);
      backdrop-filter: blur(10px);
      z-index: 9999;
    }

    #restOverlay .box{
      width: min(560px, 100%);
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(15,23,42,.92);
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
      padding: 18px;
    }

    #restOverlay .title{
      font-weight: 800;
      font-size: 19px;
      margin-bottom: 6px;
    }

    #restOverlay .big{
      font-weight: 900;
      font-size: 64px;
      line-height: 1;
      margin: 12px 0;
      text-align: center;
    }

    #restOverlay .sub{
      text-align: center;
      opacity: .9;
      font-size: 15px;
    }

    #restOverlay .bar{
      height: 10px;
      background: rgba(255,255,255,.10);
      border-radius: 999px;
      overflow: hidden;
      margin: 14px 0 10px;
    }

    #restOverlay .bar > div{
      height: 100%;
      width: 0%;
      background: rgba(56,189,248,.95);
    }

    #restOverlay .btns{
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    #restOverlay .btns button{
      flex: 1 1 auto;
      padding: 14px 14px;
      border-radius: 16px;
      font-size: 16px;
      min-height: 48px;
    }

    /* iPhone tweaks (medium) */
    @media (max-width: 430px){
      .app{ padding: 16px 12px 26px; }
      .card .hd{ padding: 13px 13px 11px; }
      .card .bd{ padding: 12px 13px 13px; }
      .workoutCard h2{ font-size: 21px; }
      .footerBar{ padding: 10px; }
    }

    @media (max-width: 375px){
      .workoutCard h2{ font-size: 20px; }
      .kpi{ min-width: 120px; }
      .footerBar button{ flex-basis: 110px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">
        <h1>Calisthenics — Phase 1</h1>
        <p id="subtitle"></p>
      </div>
      <div class="pill" id="pill">Offline OK</div>
    </header>

    <main id="root"></main>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Import -->
  <input id="importFile" type="file" accept="application/json" style="display:none" />

  <script src="app.js"></script>
</body>
</html>
